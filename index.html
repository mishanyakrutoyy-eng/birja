<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GemStock | Fixed Pro Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #08090a;
      --panel: #111214;
      --accent: #007AFF;
      --text: #ffffff;
      --text-dim: #5f6368;
      --up: #0ecb81;
      --down: #f6465d;
      --border: #1e2023;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; font-size: 14px; }
    
    /* Overlay загрузки */
    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 1000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: opacity 0.4s ease;
    }
    .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(0,122,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ticker-wrap { 
      height: 35px; background: var(--panel); border-bottom: 1px solid var(--border); 
      display: flex; align-items: center; overflow: hidden; white-space: nowrap;
    }
    .ticker-move { display: inline-block; animation: ticker 30s linear infinite; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .ticker-item { display: inline-block; margin-right: 40px; font-family: 'JetBrains Mono'; font-size: 12px; }

    .app-container { display: grid; grid-template-columns: 80px 1fr 320px; height: calc(100vh - 35px); position: relative; }

    nav { border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .nav-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
    .nav-icon:hover, .nav-icon.active { color: var(--accent); background: rgba(0,122,255,0.1); }

    .main-content { display: grid; grid-template-rows: 1fr 250px; border-right: 1px solid var(--border); overflow: hidden; }
    .trading-view { display: grid; grid-template-columns: 1fr 300px; }
    
    .chart-area { padding: 20px; border-right: 1px solid var(--border); position: relative; display: flex; flex-direction: column; background: #0a0b0d; }
    #candleChart { flex: 1; width: 100%; cursor: crosshair; }

    .order-book { padding: 15px; font-family: 'JetBrains Mono'; font-size: 12px; overflow: hidden; }
    .ob-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 3px 0; position: relative; }
    .ob-bg-up { position: absolute; right: 0; top: 0; bottom: 0; background: rgba(14,203,129,0.08); z-index: 0; }
    .ob-bg-down { position: absolute; right: 0; top: 0; bottom: 0; background: rgba(246,70,93,0.08); z-index: 0; }
    .ob-row span { position: relative; z-index: 1; }

    .execution-panel { padding: 20px; display: flex; flex-direction: column; gap: 15px; border-left: 1px solid var(--border); }
    .wallet-info { background: var(--panel); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); }
    .trade-tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 4px; }
    .t-tab { flex: 1; text-align: center; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; }
    .t-tab.active.buy { background: var(--up); color: white; }
    .t-tab.active.sell { background: var(--down); color: white; }

    .input-group { position: relative; margin-top: 15px; }
    .input-group label { font-size: 11px; color: var(--text-dim); position: absolute; top: -8px; left: 10px; background: var(--bg); padding: 0 5px; z-index: 1; }
    .input-group input { width: 100%; background: transparent; border: 1px solid var(--border); padding: 15px; border-radius: 8px; color: white; outline: none; font-family: 'JetBrains Mono'; }
    .input-group input:focus { border-color: var(--accent); }

    .exec-btn { width: 100%; padding: 18px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 5px; }

    .catalog-box { flex: 1; overflow-y: auto; padding-right: 5px; }
    .catalog-box::-webkit-scrollbar { width: 4px; }
    .catalog-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    
    .asset-item { 
      background: var(--panel); padding: 12px; border-radius: 10px; border: 1px solid var(--border); 
      cursor: pointer; transition: 0.2s; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .asset-item:hover { border-color: var(--accent); background: #16181a; }
    .asset-item.active { border-color: var(--accent); background: rgba(0,122,255,0.05); }

    .history-area { border-top: 1px solid var(--border); padding: 20px; overflow-y: auto; }
    .h-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .h-table th { text-align: left; color: var(--text-dim); padding-bottom: 10px; }
    .h-table td { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }

    .text-up { color: var(--up); }
    .text-down { color: var(--down); }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loader-spinner"></div>
  <p style="margin-top: 15px; font-weight: 700; letter-spacing: 1px; color: var(--text-dim); font-size: 10px;">LOADING MARKET DATA...</p>
</div>

<div class="ticker-wrap">
  <div class="ticker-move" id="ticker-content"></div>
</div>

<div class="app-container">
  <nav>
    <div class="nav-icon active"><i class="fas fa-chart-line"></i></div>
    <div class="nav-icon"><i class="fas fa-wallet"></i></div>
    <div class="nav-icon"><i class="fas fa-history"></i></div>
    <div class="nav-icon" style="margin-top: auto;"><i class="fas fa-cog"></i></div>
  </nav>

  <div class="main-content">
    <div class="trading-view">
      <div class="chart-area">
        <div style="display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10;">
          <div>
            <h1 id="curr-name" style="font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px;">GEM/USDT</h1>
            <span id="curr-price" class="text-up" style="font-size: 1.1rem; font-family: 'JetBrains Mono'; font-weight: 700;">0.0000</span>
          </div>
          <div style="text-align: right; font-family: 'JetBrains Mono';">
            <div style="color: var(--text-dim); font-size: 10px; font-weight: 800; text-transform: uppercase;">24h Change</div>
            <div id="curr-change" class="text-up">+0.00%</div>
          </div>
        </div>
        <canvas id="candleChart"></canvas>
      </div>

      <div class="order-book">
        <div style="color: var(--text-dim); font-size: 11px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase;">Live Order Book</div>
        <div id="ob-asks"></div>
        <div id="ob-mid" style="padding: 12px 0; font-weight: 800; font-size: 14px; text-align: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 8px 0; font-family: 'JetBrains Mono';"></div>
        <div id="ob-bids"></div>
      </div>
    </div>

    <div class="history-area">
      <div style="font-weight: 800; margin-bottom: 15px; font-size: 12px; color: var(--text-dim); text-transform: uppercase;">Recent Transactions</div>
      <table class="h-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Action</th>
            <th>Asset</th>
            <th>Amount</th>
            <th>Price</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="h-body"></tbody>
      </table>
    </div>
  </div>

  <div class="execution-panel">
    <div class="wallet-info">
      <div style="color: var(--text-dim); font-size: 10px; font-weight: 800; margin-bottom: 5px;">ACCOUNT EQUITY</div>
      <div id="total-balance" style="font-size: 1.4rem; font-weight: 800;">$10,000.00</div>
      <div id="owned-qty" style="font-size: 11px; color: var(--accent); margin-top: 5px; font-family: 'JetBrains Mono';">Vault: 0.000000 units</div>
    </div>

    <div class="trade-box">
      <div class="trade-tabs">
        <div class="t-tab active buy" onclick="setSide('buy', this)">BUY</div>
        <div class="t-tab sell" onclick="setSide('sell', this)">SELL</div>
      </div>

      <div class="input-group">
        <label>MARKET PRICE</label>
        <input type="text" id="market-display" value="LOADING..." disabled>
      </div>

      <div class="input-group">
        <label>ORDER VALUE (USDT)</label>
        <input type="number" id="trade-amount" placeholder="0.00" oninput="calcQty()">
      </div>

      <div style="margin: 15px 0; font-size: 11px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono';">
        <span style="color: var(--text-dim);">You receive:</span>
        <span id="exec-qty" style="font-weight: 700; color: var(--text);">0.000000</span>
      </div>
      
      <button id="exec-btn" class="exec-btn" style="background: var(--up); color: white;" onclick="execute()">Place Order</button>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-top: 10px;">
      <div style="color: var(--text-dim); font-size: 10px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase;">Market Catalog</div>
      <div id="asset-catalog" class="catalog-box"></div>
    </div>
  </div>
</div>

<script>
  let state = {
    balance: 10000.00,
    side: 'buy',
    activeGem: null,
    portfolio: {},
    history: []
  };

  const gems = [
    { name: 'Gemcoin', sym: 'GEM', price: 250.40, ch: 2.4, color: '#007AFF', candles: [] },
    { name: 'Aether', sym: 'AET', price: 42.10, ch: -0.8, color: '#AF52DE', candles: [] },
    { name: 'Solstice', sym: 'SOL', price: 89.20, ch: 1.1, color: '#FF9500', candles: [] },
    { name: 'Nebula', sym: 'NEB', price: 0.0054, ch: 18.2, color: '#34C759', candles: [] }
  ];

  const canvas = document.getElementById('candleChart');
  const ctx = canvas.getContext('2d');

  function init() {
    // Убираем оверлей после первичной настройки
    setTimeout(() => {
      selectGem('GEM');
      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
    }, 1200);

    updateTicker();
    setInterval(marketLogic, 2000);
    startChartEngine();
  }

  // ФИКС БАГА: Генерация истории теперь бесшовная
  function generateHistory(gem) {
    gem.candles = [];
    let currentPrice = gem.price * (1 - (Math.random() * 0.1)); 
    for(let i=0; i<65; i++) {
      let open = currentPrice;
      let close = open + (Math.random() - 0.5) * (open * 0.02);
      let high = Math.max(open, close) + Math.random() * (open * 0.005);
      let low = Math.min(open, close) - Math.random() * (open * 0.005);
      gem.candles.push({ open, close, high, low });
      currentPrice = close;
    }
    gem.price = currentPrice; 
  }

  // ФИКС БАГА: Логика рынка теперь привязана к последней точке закрытия
  function marketLogic() {
    gems.forEach(g => {
      if(g.candles.length === 0) return;
      
      const lastCandle = g.candles[g.candles.length - 1];
      const volatility = (Math.random() - 0.48) * 0.008; 
      
      const open = lastCandle.close; // Новая свеча начинается ровно там, где закрылась старая
      const close = open * (1 + volatility);
      const high = Math.max(open, close) + (open * Math.random() * 0.002);
      const low = Math.min(open, close) - (open * Math.random() * 0.002);
      
      g.price = close;
      g.ch += (volatility * 100);
      
      g.candles.push({ open, close, high, low });
      if(g.candles.length > 75) g.candles.shift();
    });
    
    syncUI();
    renderOrderBook();
    updateTicker();
    renderCatalog();
  }

  function syncUI() {
    if (!state.activeGem) return;
    const p = state.activeGem.price;
    document.getElementById('curr-price').innerText = p.toFixed(p < 1 ? 6 : 2);
    document.getElementById('market-display').value = p.toFixed(p < 1 ? 6 : 2) + " USDT";
    document.getElementById('curr-change').innerText = (state.activeGem.ch >= 0 ? '+' : '') + state.activeGem.ch.toFixed(2) + "%";
    document.getElementById('curr-price').className = state.activeGem.ch >= 0 ? 'text-up' : 'text-down';
    document.getElementById('curr-change').className = state.activeGem.ch >= 0 ? 'text-up' : 'text-down';
    document.getElementById('owned-qty').innerText = `Vault: ${(state.portfolio[state.activeGem.sym] || 0).toFixed(6)} units`;
  }

  function startChartEngine() {
    function draw() {
      if(!state.activeGem || state.activeGem.candles.length === 0) {
        requestAnimationFrame(draw);
        return;
      }
      
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * 0.85 * dpr;
      ctx.scale(dpr, dpr);
      
      const w = rect.width;
      const h = rect.height * 0.85;
      const data = state.activeGem.candles;
      
      // Динамический масштаб, чтобы свечи не улетали за края
      const min = Math.min(...data.map(c => c.low)) * 0.998;
      const max = Math.max(...data.map(c => c.high)) * 1.002;
      const range = max - min;

      ctx.clearRect(0,0,w,h);

      // Сетка Pro
      ctx.strokeStyle = 'rgba(255,255,255,0.02)';
      for(let i=1; i<8; i++) {
        const y = (h/8) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      const candleW = (w / data.length) * 0.7;
      const gap = (w / data.length) * 0.3;

      data.forEach((c, i) => {
        const x = i * (candleW + gap);
        const yOpen = h - ((c.open - min) / range) * h;
        const yClose = h - ((c.close - min) / range) * h;
        const yHigh = h - ((c.high - min) / range) * h;
        const yLow = h - ((c.low - min) / range) * h;

        const color = c.close >= c.open ? '#0ecb81' : '#f6465d';
        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        ctx.beginPath();
        ctx.moveTo(x + candleW/2, yHigh);
        ctx.lineTo(x + candleW/2, yLow);
        ctx.stroke();
        ctx.fillRect(x, Math.min(yOpen, yClose), candleW, Math.max(Math.abs(yClose - yOpen), 1));
      });

      requestAnimationFrame(draw);
    }
    draw();
  }

  function selectGem(sym) {
    const overlay = document.getElementById('loading-overlay');
    overlay.style.display = 'flex';
    overlay.style.opacity = '1';
    
    setTimeout(() => {
      state.activeGem = gems.find(g => g.sym === sym);
      generateHistory(state.activeGem);
      document.getElementById('curr-name').innerText = state.activeGem.sym + "/USDT";
      document.getElementById('exec-btn').innerText = (state.side === 'buy' ? 'Buy ' : 'Sell ') + state.activeGem.sym;
      
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 400);
      syncUI();
      renderCatalog();
    }, 600);
  }

  function renderCatalog() {
    const container = document.getElementById('asset-catalog');
    container.innerHTML = gems.map(g => `
      <div class="asset-item ${state.activeGem?.sym === g.sym ? 'active' : ''}" onclick="selectGem('${g.sym}')">
        <div>
          <div style="font-weight: 800; font-size: 13px;">${g.sym}/USDT</div>
          <div style="font-size: 10px; color: var(--text-dim);">${g.name}</div>
        </div>
        <div style="text-align: right;">
          <div style="font-family: 'JetBrains Mono'; font-weight: 700;">${g.price.toFixed(2)}</div>
          <div class="${g.ch >= 0 ? 'text-up' : 'text-down'}" style="font-size: 10px;">${g.ch.toFixed(2)}%</div>
        </div>
      </div>
    `).join('');
  }

  function renderOrderBook() {
    const asks = document.getElementById('ob-asks');
    const bids = document.getElementById('ob-bids');
    if(!state.activeGem) return;
    
    let askHtml = '', bidHtml = '';
    for(let i=0; i<6; i++) {
      const pAsk = state.activeGem.price * (1 + (i+1)*0.001);
      const pBid = state.activeGem.price * (1 - (i+1)*0.001);
      const size = (Math.random() * 2).toFixed(3);
      askHtml = `<div class="ob-row text-down"><div class="ob-bg-down" style="width: ${size*40}%"></div><span>${pAsk.toFixed(4)}</span><span>${size}</span><span style="text-align:right">${(pAsk*size).toFixed(1)}</span></div>` + askHtml;
      bidHtml += `<div class="ob-row text-up"><div class="ob-bg-up" style="width: ${size*40}%"></div><span>${pBid.toFixed(4)}</span><span>${size}</span><span style="text-align:right">${(pBid*size).toFixed(1)}</span></div>`;
    }
    asks.innerHTML = askHtml;
    bids.innerHTML = bidHtml;
    document.getElementById('ob-mid').innerText = state.activeGem.price.toFixed(4);
  }

  function updateTicker() {
    const ticker = document.getElementById('ticker-content');
    const content = gems.map(g => `<span class="ticker-item"><span style="color:var(--text-dim)">${g.sym}</span> <span class="${g.ch >= 0 ? 'text-up' : 'text-down'}">${g.price.toFixed(2)}</span></span>`).join('');
    ticker.innerHTML = content + content;
  }

  function setSide(s, el) {
    state.side = s;
    document.querySelectorAll('.t-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const btn = document.getElementById('exec-btn');
    btn.style.background = s === 'buy' ? 'var(--up)' : 'var(--down)';
    btn.innerText = (s === 'buy' ? 'Buy ' : 'Sell ') + state.activeGem.sym;
  }

  function execute() {
    const amt = parseFloat(document.getElementById('trade-amount').value);
    if (!amt || amt <= 0) return;
    if (state.side === 'buy') {
      if (amt > state.balance) return;
      state.balance -= amt;
      state.portfolio[state.activeGem.sym] = (state.portfolio[state.activeGem.sym] || 0) + (amt / state.activeGem.price);
    } else {
      const qty = amt / state.activeGem.price;
      if (qty > (state.portfolio[state.activeGem.sym] || 0)) return;
      state.balance += amt;
      state.portfolio[state.activeGem.sym] -= qty;
    }
    
    state.history.push({ time: new Date().toLocaleTimeString(), action: state.side, asset: state.activeGem.sym, amt: amt, price: state.activeGem.price });
    document.getElementById('total-balance').innerText = "$" + state.balance.toLocaleString();
    renderHistory();
    syncUI();
  }

  function renderHistory() {
    const body = document.getElementById('h-body');
    body.innerHTML = state.history.slice(-5).map(h => `<tr><td>${h.time}</td><td class="${h.action === 'buy' ? 'text-up' : 'text-down'}">${h.action.toUpperCase()}</td><td>${h.asset}</td><td>${h.amt.toFixed(2)}</td><td>${h.price.toFixed(2)}</td><td class="text-up">FILLED</td></tr>`).reverse().join('');
  }

  init();
</script>
</body>
</html>
